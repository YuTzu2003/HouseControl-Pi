[project]
name = "iot-control"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "mfrc522>=0.0.7",
    "paho-mqtt>=2.0,<3.0",
    "rpi-gpio>=0.7.1",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
iot-control = "house_pi:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
